name: tekartik_audio_web
description: Audio for the web
version: 0.2.1
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  path: ">=1.9.1"
  web:
  http:
  tekartik_browser_utils:
    git:
      url: https://github.com/tekartik/browser_utils.dart
    version: '>=0.1.0'
  tekartik_common_utils:
    git:
      url: https://github.com/tekartik/common_utils.dart

dev_dependencies:
  test: ">=1.31.0"
  process_run: ">=1.2.4"
  # run_ci runs the browser tests (test/audio_sample_test.dart) of a package
  # depending on build_web_compilers only.
  build_web_compilers: ">=4.4.19"
resolution: workspace
